name: Backend CI

on:
  push:
    branches: [ main ]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'

jobs:
  build-and-test:
    name: Build and Test .NET API
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: solar_test
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: solar_tests
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U solar_test -d solar_tests"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      TEST_DATABASE_CONNECTION_STRING: Host=localhost;Port=5432;Database=solar_tests;Username=solar_test;Password=ci-only-password

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore backend/SolarPlatform.sln

      - name: Build solution
        run: dotnet build backend/SolarPlatform.sln --no-restore --configuration Release

      - name: Run unit tests
        run: dotnet test backend/SolarPlatform.sln --no-build --configuration Release --verbosity normal
