name: Agentic AI CI

on:
  push:
    branches: [ main ]
    paths:
      - 'agentic-ai/**'
      - '.github/workflows/ai-ci.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'agentic-ai/**'
      - '.github/workflows/ai-ci.yml'

jobs:
  test-ai:
    name: Test Agentic AI Service
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        working-directory: agentic-ai
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pytest
        working-directory: agentic-ai
        run: pytest
