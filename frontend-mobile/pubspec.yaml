name: smart_solar_mobile
description: Smart Solar Installation & Grid Compliance Platform - Mobile Client
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  http_parser: ^4.1.0
  provider: ^6.1.1
  flutter_secure_storage: ^9.0.0
  image_picker: ^1.1.2
  geolocator: ^14.0.2
  flutter_map: 8.2.2
  latlong2: 0.9.1
  url_launcher: 6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/hero-solar.jpg
    - assets/images/solar-home-portrait.png
    - assets/images/hero-engineer.png
    - assets/images/login-solar-solution.png
    - assets/images/register-solar-engineer.png
