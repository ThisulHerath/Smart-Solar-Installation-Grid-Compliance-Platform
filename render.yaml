services:
  - type: pserv
    name: smart-solar-agentic-ai
    runtime: docker
    plan: 0.5c-512mb
    region: singapore
    dockerContext: ./agentic-ai
    dockerfilePath: ./agentic-ai/Dockerfile
    envVars:
      - fromGroup: smart-solar-internal

  - type: web
    name: smart-solar-api
    runtime: docker
    plan: free
    region: singapore
    dockerContext: ./backend/SolarPlatform.Api
    dockerfilePath: ./backend/SolarPlatform.Api/Dockerfile
    healthCheckPath: /api/health
    envVars:
      - fromGroup: smart-solar-internal
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: APPLY_DATABASE_MIGRATIONS
        value: "true"
      - key: ENABLE_SWAGGER
        value: "false"
      - key: FILE_STORAGE_PROVIDER
        value: cloudinary
      - key: CLOUDINARY_ROOT_FOLDER
        value: smart-solar
      - key: AGENTIC_AI_BASE_URL
        fromService:
          type: pserv
          name: smart-solar-agentic-ai
          property: hostport
      - key: DATABASE_CONNECTION_STRING
        sync: false
      - key: JWT_KEY
        generateValue: true
      - key: JWT_ISSUER
        value: smart-solar-api
      - key: JWT_AUDIENCE
        value: smart-solar-clients
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false

envVarGroups:
  - name: smart-solar-internal
    envVars:
      - key: AGENTIC_AI_INTERNAL_KEY
        generateValue: true
